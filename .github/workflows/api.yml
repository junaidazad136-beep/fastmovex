name: API

on:
  push:
    branches: [main]
    paths: ['apps/api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['apps/api/**', '.github/workflows/api.yml']

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jovia
          POSTGRES_PASSWORD: jovia
          POSTGRES_DB: jovia
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U jovia -d jovia" --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:2024
        env:
          MINIO_ROOT_USER: jovia
          MINIO_ROOT_PASSWORD: jovia-minio-secret
          MINIO_DEFAULT_BUCKETS: jovia-public:download,jovia-private
        ports: ['9000:9000']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://jovia:jovia@localhost:5432/jovia
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      FIELD_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: jovia
      S3_SECRET_ACCESS_KEY: jovia-minio-secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_PUBLIC: jovia-public
      S3_BUCKET_PRIVATE: jovia-private
      PUBLIC_MEDIA_BASE_URL: http://localhost:9000/jovia-public
      NOTIFY_EMAIL_DRIVER: log
      NOTIFY_SMS_DRIVER: log
      SEED_SUPERADMIN_EMAIL: owner@jovia.test
      SEED_SUPERADMIN_PASSWORD: Owner-Pass-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Type-check
        run: npm run typecheck
      - name: Unit + API tests
        run: npm test -- --ci
      - name: Production build
        run: npm run build
      - name: Apply migrations to a real PostgreSQL
        run: npx prisma migrate deploy
      - name: Seed base config + demo data
        run: npm run db:seed && npm run db:seed:demo
      - name: Integration tests (full marketplace flow on the real database)
        run: npm run test:int -- --ci

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          tags: jovia-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
