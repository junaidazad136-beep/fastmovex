name: Admin

on:
  push:
    branches: [main]
    paths: ['apps/admin/**', 'apps/api/**', '.github/workflows/admin.yml']
  pull_request:
    paths: ['apps/admin/**', 'apps/api/**', '.github/workflows/admin.yml']

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fastmovex
          POSTGRES_PASSWORD: fastmovex
          POSTGRES_DB: fastmovex
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fastmovex -d fastmovex" --health-interval 5s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:2024
        env:
          MINIO_ROOT_USER: fastmovex
          MINIO_ROOT_PASSWORD: fastmovex-minio-secret
          MINIO_DEFAULT_BUCKETS: fastmovex-public:download,fastmovex-private
        ports: ['9000:9000']
    env:
      # API (runs in the background for the browser tests)
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://fastmovex:fastmovex@localhost:5432/fastmovex
      JWT_ACCESS_SECRET: ci-only-secret-0123456789abcdefghijklmnopqrstuvwxyz
      FIELD_ENCRYPTION_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: fastmovex
      S3_SECRET_ACCESS_KEY: fastmovex-minio-secret
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_PUBLIC: fastmovex-public
      S3_BUCKET_PRIVATE: fastmovex-private
      PUBLIC_MEDIA_BASE_URL: http://localhost:9000/fastmovex-public
      CORS_ORIGINS: http://localhost:3001
      NOTIFY_EMAIL_DRIVER: log
      NOTIFY_SMS_DRIVER: log
      RATE_LIMIT_DISABLED: 'true'
      INTERNAL_API_KEY: ci-internal-key-0123456789abcdefghijkl
      SEED_SUPERADMIN_EMAIL: owner@fastmovex.test
      SEED_SUPERADMIN_PASSWORD: Owner-Pass-2026
      # Admin panel
      PUBLIC_API_URL: http://localhost:4000/api/v1
      STOREFRONT_URL: http://localhost:3000
      MEDIA_URL: http://localhost:9000
      SUPER_ADMIN_EMAIL: owner@fastmovex.test
      SUPER_ADMIN_PASSWORD: Owner-Pass-2026
      E2E_API_LOG: ${{ github.workspace }}/api.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/admin/package-lock.json

      - name: API — install, migrate, seed, start
        working-directory: apps/api
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          npx prisma migrate deploy
          npm run db:seed && npm run db:seed:demo
          nohup node dist/main.js > "$E2E_API_LOG" 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4000/api/v1/health && break; sleep 1; done

      - name: Admin — install, type-check, unit tests
        working-directory: apps/admin
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Admin — production build and start
        working-directory: apps/admin
        run: |
          npm run build
          cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static
          PORT=3001 HOSTNAME=0.0.0.0 NODE_ENV=production nohup node .next/standalone/server.js > admin.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3001/robots.txt >/dev/null && break; sleep 1; done

      - name: Browser tests (roles, catalogue, orders, phone, accessibility)
        working-directory: apps/admin
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/e2e/.results
            api.log
            apps/admin/admin.log

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: apps/admin
          push: false
          tags: fastmovex-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
