<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7422E6">
<title>Offline · FastMoveX</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #fcfbfa; color: #1b1815; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #5d554d; margin: 4px 0; line-height: 1.6; }
  button { margin-top: 20px; background: #7422E6; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 600; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="FastMoveX">
  <h1>You are offline · أنت غير متصل</h1>
  <p>Check your connection. Pages you opened recently may still be available.</p>
  <p dir="rtl" lang="ar">تحقق من اتصالك. قد تبقى الصفحات التي فتحتها مؤخراً متاحة.</p>
  <button type="button" onclick="location.reload()">Try again · حاول مرة أخرى</button>
</main>
</body>
</html>
