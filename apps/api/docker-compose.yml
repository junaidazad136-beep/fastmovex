# Local development infrastructure.
#   docker compose up -d                  # Postgres, Redis, MinIO (S3) + buckets
#   docker compose --profile api up -d    # ...and the API itself from the Dockerfile
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fastmovex
      POSTGRES_PASSWORD: fastmovex
      POSTGRES_DB: fastmovex
      # UTF8 is required (Arabic text). The migrations refuse to run on anything else.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastmovex -d fastmovex"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: fastmovex, MINIO_ROOT_PASSWORD: fastmovex-minio-secret }
    ports: ["9000:9000", "9001:9001"]   # 9001 = web console
    volumes: [miniodata:/data]

  minio-init:   # creates buckets once: public (images) + private (seller documents)
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 fastmovex fastmovex-minio-secret;
      mc mb -p local/fastmovex-public local/fastmovex-private;
      mc anonymous set download local/fastmovex-public;
      exit 0;"

  api:
    profiles: [api]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fastmovex:fastmovex@postgres:5432/fastmovex
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      NODE_ENV: development
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
